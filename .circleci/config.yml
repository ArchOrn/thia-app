version: 2.1
orbs:
  node: circleci/node@7.0.0
commands:
  npm_install:
    steps:
      - node/install-packages:
          pkg-manager: npm
  install_requirements:
    steps:
      - run:
          name: Install Ninja
          command: |
            sudo apt-get update && sudo apt-get install -y ninja-build
      - run:
          name: Set CMake and Ninja Paths
          command: |
            export PATH=$HOME/ninja:$PATH
  setup_android_secrets:
    steps:
      - run:
          name: Create secret files not committed to the repository
          command: |
            echo "$KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
            echo "$SENTRY_PROPERTIES_BASE64" | base64 --decode > android/sentry.properties
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/upload.keystore
  clean_android_secrets:
    steps:
      - run:
          name: Clean secret files
          command: |
            rm android/key.properties
            rm android/sentry.properties
            rm android/app/upload.keystore
  rn_android_build:
    description: Builds the Android app at the given path with the given build types. This should be run only after installing dependencies.
    parameters:
      build_type:
        default: debug
        description: The build type to build. This is normally either "debug" or "release" but you may have custom build types configured for your app.
        type: string
    steps:
      - run:
          name: Build React Native Android
          command: |
            npx react-native build-android --mode=<<parameters.build_type>>
jobs:
  checkout_code:
    executor: linux_android
    steps:
      - checkout
      - persist_to_workspace:
          paths: [ . ]
          root: .
  android_setup:
    executor: linux_android
    steps:
      - setup_android_secrets
      - persist_to_workspace:
          paths: [ . ]
          root: .
  android_cleanup:
    executor: linux_android
    steps:
      - clean_android_secrets
      - persist_to_workspace:
          paths: [ . ]
          root: .
  android_build:
    executor: linux_android
    parameters:
      build_type:
        default: debug
        description: The build type to build. This is normally either "debug" or "release" but you may have custom build types configured for your app.
        type: string
    steps:
      - attach_workspace:
          at: .
      - npm_install
      - install_requirements
      - rn_android_build:
          build_type: <<parameters.build_type>>
      - store_artifacts:
          path: android/app/build/outputs/apk
  ios_build:
    executor: macos
    parameters:
      project_path:
        type: string
      scheme:
        type: string
      device:
        type: string
      build_configuration:
        type: string
    working_directory: ios
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install CocoaPods
          command: pod install
      - run:
          name: Build iOS
          command: |
            xcodebuild -workspace <<parameters.project_path>> -scheme <<parameters.scheme>> -destination 'platform=iOS Simulator,name=<<parameters.device>>' -configuration <<parameters.build_configuration>> build
      - store_artifacts:
          path: ios/build/Release-iphonesimulator
executors:
  linux_android:
    parameters:
      build_image_version:
        default: "2025.01-node"
        description: Android build image version. For available versions, see https://circleci.com/developer/images/image/cimg/android#image-tags
        type: string
      gradle_options:
        default: -Xmx2014m -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-XX:+UnlockExperimentalVMOptions -XX:+HeapDumpOnOutOfMemoryError"
        description: Gradle command options. Note that setting this will override the default options so you might need to supply those as well.
        type: string
      resource_class:
        default: large
        description: Changes the resource class of the executor. Requires a support request to enable the resource_class parameter. See https://circleci.com/docs/2.0/configuration-reference/#resource_class
        type: string
    docker:
      - image: cimg/android:<<parameters.build_image_version>>
    environment:
      GRADLE_OPTS: <<parameters.gradle_options>>
    resource_class: <<parameters.resource_class>>
  macos:
    parameters:
      resource_class:
        default: macos.m1.medium.gen1
        description: Changes the resource class of the executor. Requires a support request to enable the resource_class parameter. See https://circleci.com/docs/2.0/configuration-reference/#resource_class
        type: string
      xcode_version:
        default: 16.2.0
        description: The version of Xcode to use. See here for the list of supported versions https://circleci.com/docs/2.0/testing-ios/#supported-xcode-versions
        type: string
    macos:
      xcode: <<parameters.xcode_version>>
    resource_class: <<parameters.resource_class>>
workflows:
  android:
    jobs:
      - checkout_code
      - android_setup:
          requires:
            - checkout_code
      - android_build:
          build_type: release
          requires:
            - android_setup
      - android_cleanup:
          requires:
            - android_build
  ios:
    jobs:
      - checkout_code
      - ios_build:
          build_configuration: Release
          device: iPhone 11
          name: build_ios_release
          project_path: ios/ThiaApp.xcodeproj
          requires:
            - checkout_code
          scheme: ThiaApp